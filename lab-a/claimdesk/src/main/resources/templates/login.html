<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>ClaimDesk — Sign in</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#eef2f6;margin:0}
    .card{max-width:360px;margin:8vh auto;background:#fff;padding:28px 30px;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
    h1{font-size:20px;color:#0f3d61;margin:0 0 4px}
    .sub{color:#6b7a88;font-size:13px;margin-bottom:18px}
    label{display:block;font-size:13px;color:#33434f;margin:10px 0 4px}
    input{width:100%;padding:9px 10px;border:1px solid #cdd7df;border-radius:6px;box-sizing:border-box}
    button{width:100%;margin-top:16px;padding:10px;background:#0f6fc5;color:#fff;border:0;border-radius:6px;font-size:15px;cursor:pointer}
    .err{background:#fde8e8;color:#9b2c2c;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px;word-break:break-all}
    .ok{background:#e6f6ec;color:#1b6b3a;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px}
    a{color:#0f6fc5;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Harborline ClaimDesk</h1>
    <div class="sub">Policyholder &amp; adjuster portal</div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <div class="ok" th:if="${ok}" th:text="${ok}"></div>
    <form method="post" action="/login">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username"/>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password"/>
      <button type="submit">Sign in</button>
    </form>
    <p style="margin-top:14px"><a href="/register">Create an account</a></p>
  </div>
</body>
</html>

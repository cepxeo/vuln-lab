server.port=8085
spring.application.name=claimdesk

spring.datasource.url=jdbc:h2:mem:claimdesk;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# DB console for the support team
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Ops monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=ClaimDesk
info.app.version=3.4.1
info.app.vendor=Harborline Insurance

server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

claimdesk.document-root=/app/documents
claimdesk.mail.relay=smtp.harborline.internal:587
claimdesk.mail.user=claims-notify
claimdesk.mail.pass=${CLAIMDESK_SMTP_PASSWORD:changeme}
claimdesk.broker-feed.url=sftp://brokerfeed:Feed2024@files.harborline.internal/inbound

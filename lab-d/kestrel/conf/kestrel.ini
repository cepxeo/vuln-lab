; Quiet errors: nothing about a failure reaches the page.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
output_buffering = 8192
session.save_path = /var/lib/kestrel/sessions
session.name = kc_session
session.cookie_httponly = On
upload_max_filesize = 1M
post_max_size = 2M

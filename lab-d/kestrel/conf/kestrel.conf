# The public site. The internal carrier-key service (the SSRF target of D7) is
# a separate listener on loopback, started by entrypoint.sh; never published.
ServerName kestrel
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/kestrel/public
    # A path segment may carry an encoded slash (the region pages).
    AllowEncodedSlashes NoDecode
    <Directory /var/www/kestrel/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Kept from the old site, whose templates were .phtml files (D12).
    <FilesMatch "\.phtml$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>

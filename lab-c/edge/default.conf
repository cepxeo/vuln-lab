# Edge reverse proxy for the benchmark apps.
#
# Fronts shopfront, taskhub and gateway on one host name and serves static
# assets. Intended as a realistic "middleware" layer for the dynamic and
# infrastructure scanners to look at.

server {
    listen 80 default_server;
    server_name _;

    server_tokens on;

    # Build/version info surfaced for the status dashboard.
    location = /nginx_status {
        stub_status on;
        access_log off;
    }

    # Static assets. The front-end bundles live under the html root.
    location /static {
        alias /usr/share/nginx/html/;
        autoindex on;
    }

    # Storefront API.
    location /shop/ {
        proxy_pass http://shopfront:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Task board API.
    location /tasks/ {
        proxy_pass http://taskhub:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal asset gateway. Exposed through the edge for the ops dashboard.
    location /gw/ {
        proxy_pass http://gateway:5003/;
        proxy_set_header Host $host;
    }

    location / {
        return 200 "benchmark edge\n";
        add_header Content-Type text/plain;
    }
}
